<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1840" viewBox="0 0 1600 1840" role="img" aria-labelledby="title description">
  <title id="title">Project management wireframes</title>
  <desc id="description">Five Supervisor screens: project list, create project, edit project, archive confirmation and a planned Intern assignment screen.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #253041; font-size: 20px; }
      .heading { font-size: 32px; font-weight: 700; }
      .screen-title { font-size: 25px; font-weight: 700; }
      .label { font-weight: 700; }
      .small { font-size: 18px; }
      .muted { fill: #5f6b7b; }
      .button { fill: #fff; font-size: 19px; font-weight: 700; text-anchor: middle; }
      .secondary-button { font-size: 19px; text-anchor: middle; }
      .panel { fill: #fff; stroke: #b7c0cb; stroke-width: 2; }
      .field { fill: #fff; stroke: #9aa6b4; stroke-width: 2; }
      .divider { stroke: #d7dde5; stroke-width: 2; }
      .primary { fill: #2563eb; }
      .secondary { fill: #f5f7fa; stroke: #aab4c1; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1840" fill="#f5f7fa"/>
  <text x="64" y="58" class="heading">Project management</text>
  <text x="64" y="91" class="muted">Supervisor screens · Sprint 3</text>

  <!-- Project list -->
  <rect x="64" y="120" width="1472" height="448" rx="12" class="panel"/>
  <text x="96" y="165" class="screen-title">1. Projects</text>
  <text x="96" y="198" class="small muted">All Supervisors can create, edit and archive projects.</text>
  <rect x="96" y="225" width="28" height="28" rx="3" class="field"/>
  <text x="138" y="247">Show archived projects</text>
  <rect x="1306" y="218" width="198" height="48" rx="7" class="primary"/>
  <text x="1405" y="248" class="button">+ New project</text>

  <rect x="96" y="287" width="1408" height="48" rx="4" fill="#eef1f5"/>
  <text x="114" y="318" class="label">Project</text>
  <text x="869" y="318" class="label">Status</text>
  <text x="1135" y="318" class="label">Actions</text>

  <text x="114" y="373">Campus booking</text>
  <text x="869" y="373">Active</text>
  <rect x="1135" y="346" width="118" height="42" rx="6" class="secondary"/>
  <text x="1194" y="373" class="secondary-button">Edit</text>
  <rect x="1267" y="346" width="153" height="42" rx="6" class="secondary"/>
  <text x="1343" y="373" class="secondary-button">Archive</text>
  <line x1="96" y1="405" x2="1504" y2="405" class="divider"/>

  <text x="114" y="447">Time registration</text>
  <text x="869" y="447">Active</text>
  <rect x="1135" y="420" width="118" height="42" rx="6" class="secondary"/>
  <text x="1194" y="447" class="secondary-button">Edit</text>
  <rect x="1267" y="420" width="153" height="42" rx="6" class="secondary"/>
  <text x="1343" y="447" class="secondary-button">Archive</text>
  <line x1="96" y1="479" x2="1504" y2="479" class="divider"/>
  <text x="96" y="521" class="small muted">The default list contains active projects. Archived projects appear when the checkbox is selected.</text>

  <!-- Create project -->
  <rect x="64" y="612" width="716" height="455" rx="12" class="panel"/>
  <text x="96" y="659" class="screen-title">2. Create project</text>
  <text x="96" y="708" class="label">Project name *</text>
  <rect x="96" y="724" width="652" height="48" rx="6" class="field"/>
  <text x="111" y="755" class="muted">Enter a project name</text>
  <text x="96" y="799" class="small muted">Required · Up to 100 characters</text>
  <text x="96" y="843" class="label">Description</text>
  <rect x="96" y="859" width="652" height="100" rx="6" class="field"/>
  <text x="111" y="891" class="muted">Describe the project</text>
  <text x="96" y="984" class="small muted">Optional · Up to 2,000 characters</text>
  <rect x="412" y="1000" width="138" height="43" rx="6" class="secondary"/>
  <text x="481" y="1027" class="secondary-button">Cancel</text>
  <rect x="566" y="1000" width="182" height="43" rx="6" class="primary"/>
  <text x="657" y="1027" class="button">Create project</text>

  <!-- Edit project -->
  <rect x="820" y="612" width="716" height="455" rx="12" class="panel"/>
  <text x="852" y="659" class="screen-title">3. Edit project</text>
  <text x="852" y="708" class="label">Project name *</text>
  <rect x="852" y="724" width="652" height="48" rx="6" class="field"/>
  <text x="867" y="755">Campus booking</text>
  <text x="852" y="799" class="small muted">Required · Up to 100 characters</text>
  <text x="852" y="843" class="label">Description</text>
  <rect x="852" y="859" width="652" height="100" rx="6" class="field"/>
  <text x="867" y="891">Booking system for shared campus rooms.</text>
  <text x="852" y="984" class="small muted">Optional · Up to 2,000 characters</text>
  <rect x="1168" y="1000" width="138" height="43" rx="6" class="secondary"/>
  <text x="1237" y="1027" class="secondary-button">Cancel</text>
  <rect x="1322" y="1000" width="182" height="43" rx="6" class="primary"/>
  <text x="1413" y="1027" class="button">Save changes</text>

  <!-- Archive confirmation and blocked state -->
  <rect x="64" y="1111" width="716" height="637" rx="12" class="panel"/>
  <text x="96" y="1158" class="screen-title">4. Archive project</text>
  <text x="96" y="1208" class="label">Archive “Campus booking”?</text>
  <text x="96" y="1250">The project leaves the active list.</text>
  <text x="96" y="1282">Its tasks and recorded time are kept.</text>
  <text x="96" y="1314">New tasks and assignments are blocked.</text>
  <rect x="406" y="1351" width="138" height="46" rx="6" class="secondary"/>
  <text x="475" y="1380" class="secondary-button">Cancel</text>
  <rect x="560" y="1351" width="188" height="46" rx="6" class="primary"/>
  <text x="654" y="1380" class="button">Archive project</text>
  <line x1="96" y1="1427" x2="748" y2="1427" class="divider"/>
  <text x="96" y="1468" class="label">If an Intern is still assigned</text>
  <rect x="96" y="1490" width="652" height="143" rx="6" fill="#fff6ef" stroke="#dbb28c" stroke-width="2"/>
  <text x="113" y="1526" class="label">This project cannot be archived yet.</text>
  <text x="113" y="1560">End its active Intern assignments first.</text>
  <text x="113" y="1594" class="small muted">The project stays active until this is resolved.</text>
  <text x="96" y="1676" class="small muted">Archiving does not delete project history.</text>
  <text x="96" y="1707" class="small muted">An archived project is displayed as read-only.</text>

  <!-- Assignment concept: separate task -->
  <rect x="820" y="1111" width="716" height="637" rx="12" fill="#fff" stroke="#b7c0cb" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="852" y="1158" class="screen-title">5. Manage Intern assignments</text>
  <text x="852" y="1190" class="small muted">Planned screen · Separate implementation task</text>
  <text x="852" y="1234" class="label">Project: Campus booking</text>
  <text x="852" y="1275">Available Interns</text>
  <rect x="852" y="1292" width="652" height="47" rx="6" class="field"/>
  <text x="867" y="1322" class="muted">Search by name</text>
  <text x="852" y="1378">Maja Jensen</text>
  <rect x="1366" y="1350" width="138" height="43" rx="6" class="secondary"/>
  <text x="1435" y="1377" class="secondary-button">Assign</text>
  <text x="852" y="1419" class="small muted">Only Interns with an active internship can be assigned.</text>
  <text x="852" y="1449" class="small muted">An internship can have one active project assignment.</text>
  <line x1="852" y1="1480" x2="1504" y2="1480" class="divider"/>
  <text x="852" y="1519" class="label">Currently assigned</text>
  <text x="852" y="1570">Jonas Nielsen</text>
  <rect x="1269" y="1542" width="235" height="43" rx="6" class="secondary"/>
  <text x="1386" y="1569" class="secondary-button">End assignment</text>
  <text x="852" y="1630" class="small muted">Ending an assignment preserves recorded work.</text>
  <text x="852" y="1660" class="small muted">Assigning another project requires ending the current one.</text>
  <text x="852" y="1713" class="small muted">This screen is included in the wireframes only.</text>

  <text x="64" y="1794" class="small muted">Form errors appear below the relevant input. Confirmed actions refresh the project list and show a short success message.</text>
</svg>
